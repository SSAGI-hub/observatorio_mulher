<!DOCTYPE html>
<html lang="pt-BR" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossário - Observatório da Mulher de Niterói</title>
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Readex+Pro:wght@300;400;500;700&family=Vina+Sans&display=swap" rel="stylesheet">
    
    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="css/style.css">

<!--[if gte mso 9]><xml>
<mso:CustomDocumentProperties>
<mso:_ApprovalStatus msdt:dt="string">0</mso:_ApprovalStatus>
<mso:_ApprovalAssignedTo msdt:dt="string"></mso:_ApprovalAssignedTo>
<mso:_ApprovalRespondedBy msdt:dt="string"></mso:_ApprovalRespondedBy>
</mso:CustomDocumentProperties>
</xml><![endif]-->
</head>
<body class="glossary-page" data-page="glossario">

    <!-- CABEÇALHO -->
    <div id="header-container"></div>

    <div id="accessibility-container"></div>
    <div id="libras-container"></div>

    <main>
        <!-- SEÇÃO 1: INTRODUÇÃO E FILTROS -->
        <section class="section-glossary-intro">
            <div class="glossary-container">
                <div class="glossary-intro">
                    <h1>Glossário</h1>
                    <p>Conceitos fundamentais relacionados aos direitos das mulheres, equidade de gênero e políticas públicas.</p>
                </div>

                <div class="glossary-search-wrap">
                    <input type="text" id="searchInput" placeholder="Pesquisar termo...">
                </div>

                <div class="alphabet-nav" id="alphabetNav">
                    <!-- Gerado via JS -->
                </div>

                <div>
                    <button class="btn-show-all" id="showAllBtn">Mostrar todos (A-Z)</button>
                </div>
            </div>
        </section>

        <!-- SEÇÃO 2: GRELHA DE TERMOS -->
        <section class="section-glossary-content">
            <div class="glossary-container">
                <div class="glossary-grid" id="glossaryGrid">
                    <!-- Cards injetados via JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- JANELA MODAL DE DEFINIÇÃO -->
    <div class="modal-overlay" id="definitionModal">
        <div class="glossary-modal-card">
            <button class="modal-close-btn" onclick="fecharDefinicao()">&times;</button>
            <div id="modalCardBody">
                <!-- Conteúdo preenchido dinamicamente -->
            </div>
        </div>
    </div>

    <div class="footer-gradient"></div>

    <!-- RODAPÉ -->
    <div id="footer-container"></div>

    <script src="js/acessibilidade.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <!-- SCRIPTS -->
    <script>
        let glossarioGlobal = [];
        let activeLetter = '';

        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(elementId).innerHTML = html;
                }
            } catch (error) {
                console.error(`Erro ao carregar componente ${filePath}:`, error);
            }
        }

        function normalizeText(text) {
            return text ? text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : '';
        }

        function isValidUrl(str) {
            if (!str) return false;
            const trimmed = str.trim();
            return trimmed.startsWith('http://') || trimmed.startsWith('https://');
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadComponent("header-container", "components/header.html");
            loadComponent("footer-container", "components/footer.html");

            // Gerar botões do alfabeto (A-Z)
            const alphabetNav = document.getElementById('alphabetNav');
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');

            if (alphabetNav) {
                alphabet.forEach(letter => {
                    const btn = document.createElement('button');
                    btn.classList.add('alpha-btn');
                    btn.textContent = letter;
                    btn.addEventListener('click', () => {
                        if (activeLetter === letter.toLowerCase()) {
                            activeLetter = '';
                            btn.classList.remove('active');
                        } else {
                            document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
                            activeLetter = letter.toLowerCase();
                            btn.classList.add('active');
                            const searchInput = document.getElementById('searchInput');
                            if (searchInput) searchInput.value = '';
                        }
                        filterAndReorderCards();
                    });
                    alphabetNav.appendChild(btn);
                });
            }

            // Carregar dados do JSON
            fetch('glossario_observatorio.json')
                .then(res => res.json())
                .then(data => {
                    glossarioGlobal = (data.Planilha1 || []).filter(item => item.Termo && item.Termo.trim() !== '');
                    glossarioGlobal.sort((a, b) => normalizeText(a.Termo).localeCompare(normalizeText(b.Termo)));
                    renderCards(glossarioGlobal);
                })
                .catch(err => console.error("Erro ao carregar o glossário JSON:", err));

            // Pesquisa e Filtros
            const searchInput = document.getElementById('searchInput');
            const showAllBtn = document.getElementById('showAllBtn');

            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    activeLetter = '';
                    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
                    filterAndReorderCards();
                });
            }

            if (showAllBtn) {
                showAllBtn.addEventListener('click', () => {
                    if (searchInput) searchInput.value = '';
                    activeLetter = '';
                    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
                    filterAndReorderCards();
                });
            }

            // Fechar modal ao clicar na área exterior (backdrop)
            const modal = document.getElementById('definitionModal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) fecharDefinicao();
                });
            }

            // Fechar modal ao pressionar a tecla ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') fecharDefinicao();
            });
        });

        function renderCards(items) {
            const grid = document.getElementById('glossaryGrid');
            if (!grid) return;

            grid.innerHTML = '';

            items.forEach((item, index) => {
                const termoNorm = normalizeText(item.Termo);
                const primeiraLetra = termoNorm.charAt(0);

                const card = document.createElement('div');
                card.className = 'glossary-card';
                card.setAttribute('data-term', termoNorm);
                card.setAttribute('data-letter', primeiraLetra);

                card.innerHTML = `
                    <h3>${item.Termo.trim()}</h3>
                    <button class="btn-definition" onclick="abrirDefinicao(${index})">Definição</button>
                `;

                grid.appendChild(card);
            });
        }

        function filterAndReorderCards() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput ? normalizeText(searchInput.value.trim()) : '';
            const cards = Array.from(document.querySelectorAll('.glossary-card'));

            cards.forEach(card => {
                const termText = card.getAttribute('data-term');
                const termLetter = card.getAttribute('data-letter');

                const matchesSearch = termText.includes(searchTerm);
                const matchesLetter = !activeLetter || termLetter === activeLetter;

                card.style.display = (matchesSearch && matchesLetter) ? 'flex' : 'none';
            });
        }

        function abrirDefinicao(index) {
            const item = glossarioGlobal[index];
            if (!item) return;

            const modalBody = document.getElementById('modalCardBody');
            if (!modalBody) return;

            let html = `
                <h2 class="glossary-modal-title">${item.Termo.trim()}</h2>
            `;

            // Definição Simples
            if (item["Definição simples"] && item["Definição simples"].trim()) {
                html += `
                    <div class="glossary-modal-label" style="color: var(--orange, #f26522);">DEFINIÇÃO SIMPLES</div>
                    <p class="glossary-modal-text">${item["Definição simples"].trim()}</p>
                `;
            }

            // Definição Técnica
            if (item["Definição técnica"] && item["Definição técnica"].trim()) {
                html += `
                    <div class="glossary-modal-label" style="color: var(--orange, #f26522);">DEFINIÇÃO TÉCNICA</div>
                    <p class="glossary-modal-text">${item["Definição técnica"].trim()}</p>
                `;
            }

            // Fonte
            if (item["Fonte"] && item["Fonte"].trim()) {
                html += `
                    <div class="glossary-modal-label" style="color: var(--orange, #f26522);">FONTE</div>
                    <p class="glossary-modal-text" style="font-size: 0.9rem; opacity: 0.95;">${item["Fonte"].trim()}</p>
                `;
            }

            // Processamento de múltiplos links
            const validLinks = [];
            if (item["Link"] && typeof item["Link"] === 'string') {
                item["Link"].split(';').forEach(linkBruto => {
                    const urlLimpa = linkBruto.trim();
                    if (isValidUrl(urlLimpa)) {
                        validLinks.push(urlLimpa);
                    }
                });
            }

            if (validLinks.length > 0) {
                html += `<div class="glossary-modal-label" style="color: var(--orange, #f26522);">REFERÊNCIAS / LINKS</div><div class="glossary-modal-links">`;
                validLinks.forEach((linkUrl, i) => {
                    const label = validLinks.length > 1 ? `Acessar Fonte (${i + 1})` : `Acessar Fonte`;
                    html += `
                        <a href="${linkUrl}" target="_blank" rel="noopener noreferrer" class="glossary-modal-link-btn" style="background-color: var(--orange, #f26522); color: #ffffff;">
                            <span>🔗</span> ${label}
                        </a>
                    `;
                });
                html += `</div>`;
            }

            modalBody.innerHTML = html;

            const modal = document.getElementById('definitionModal');
            if (modal) {
                modal.classList.add('active');
            }
        }

        function fecharDefinicao() {
            const modal = document.getElementById('definitionModal');
            if (modal) {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
